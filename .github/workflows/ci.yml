name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and integration tests
        run: pytest -q
      - name: Offline evaluation (regression gate)
        run: |
          python eval/run_eval.py --embedding lsa --reranker none --judge rules --out ci-results
          python - <<'EOF'
          import json
          r = json.load(open("ci-results/lsa_none_rules.json"))
          full = next(v for v in r["verdicts"] if v["setup"] == "full")
          assert not full["false_covered"], f"compliance gaps reported as covered: {full['false_covered']}"
          assert full["accuracy"] >= 0.9, f"verdict accuracy dropped to {full['accuracy']}"
          print("evaluation gate passed", full["accuracy"])
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: ci-results/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t complyrag:ci .
