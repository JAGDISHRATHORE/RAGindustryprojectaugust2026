# Answer key for the CreditLens demo corpus.
#
# verdict    expected outcome of the assessment
# evidence   sections a human assessor would cite (chunk ids are <doc_id>#s<section>).
#            For gaps these are the closest relevant sections, used to score retrieval.
# missing    checklist items that are not met. Used to check that partial
#            verdicts are partial for the right reason.
# trap       distractor sections that would wrongly turn this into "covered"
#            if they were accepted as evidence.

